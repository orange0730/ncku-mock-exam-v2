# 參考用：考場那種「commit 訊息開頭寫題號，GitLab CI 就跑那一題」的設定大概長這樣。
# 本機練習用不到它（用 ci/run_ci.py 模擬），但看懂它，考場上就知道自己的 commit 會觸發什麼。
#
#   $CI_COMMIT_MESSAGE  這次 push 的最新 commit 訊息（GitLab 內建變數）
#   rules: if          只有條件成立時才建立這個 job
#   =~ /.../i          正規表示式比對，i = 不分大小寫

stages:
  - grade

default:
  image: python:3.12-slim
  before_script:
    - apt-get update -qq && apt-get install -y -qq gcc > /dev/null

.grade_job:
  stage: grade
  artifacts:
    when: always
    paths:
      - result-*.json

grade_q1:
  extends: .grade_job
  rules:
    - if: '$CI_COMMIT_MESSAGE =~ /^\s*\[?\s*(Q1|ALL)\b/i'
  script:
    - python3 q1_ebnn/grade.py
    - python3 q1_ebnn/grade.py --json > result-q1.json

grade_q2:
  extends: .grade_job
  rules:
    - if: '$CI_COMMIT_MESSAGE =~ /^\s*\[?\s*(Q2|ALL)\b/i'
  script:
    - python3 q2_parallel/grade.py
    - python3 q2_parallel/grade.py --json > result-q2.json

grade_q3:
  extends: .grade_job
  rules:
    - if: '$CI_COMMIT_MESSAGE =~ /^\s*\[?\s*(Q3|ALL)\b/i'
  script:
    - python3 q3_algos/grade.py
    - python3 q3_algos/grade.py --json > result-q3.json
